[project]
name = "tabular-ml-benchmark-lab"
version = "0.1.0"
description = "A reproducible laboratory for benchmarking tabular machine learning models."
readme = "README.md"
authors = [
    { name = "SUYOG SAUND", email = "suyogsaud143@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "pandas>=3.1.0",
]

[project.scripts]
tabular-ml-benchmark-lab = "tabular_ml_benchmark_lab:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
